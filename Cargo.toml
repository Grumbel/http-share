[package]
name = "http-share"
version = "0.1.0-dev"
edition = "2021"
description = "Minimal HTTP(S) file sharing utility for ad-hoc file transfers"
license = "MIT"
readme = "PROPOSAL.md"

[dependencies]
# Pinned for rustc 1.75 / edition 2021 (registry serves newer edition2024 crates otherwise)
rustls = "=0.20.9"
rustls-pemfile = "=1.0.2"
rcgen = "=0.9.3"
base64 = "=0.21.5"
time = "=0.3.20"

[profile.release]
lto = true
codegen-units = 1
strip = true
